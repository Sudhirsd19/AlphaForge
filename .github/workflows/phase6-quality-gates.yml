name: phase6-quality-gates

on:
  push:
    branches:
      - phase6-implementation-check
  pull_request:
    branches:
      - master

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest -v
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy . --strict --python-version 3.12 --explicit-package-bases
